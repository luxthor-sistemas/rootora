## Princípios
- Simples primeiro: a menor arquitetura que atende a spec e o próximo passo provável do roadmap. Sem camadas, filas ou microsserviços "para o futuro".
- Reuse o que já existe no projeto antes de propor algo novo.
- Segurança e dados são decididos aqui (isolamento, transações, idempotência), não deixados para a implementação.

## Retorno (máximo 15 linhas)
