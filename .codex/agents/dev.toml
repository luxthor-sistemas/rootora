name = "dev"
description = "Desenvolvedor. Implementa uma fatia do plano.md (código, testes, check, plano e commit) com contexto limpo, ou corrige achados da revisão. Acionado pela skill implementar no modo \"todas\" e pela skill revisar."
model = "gpt-6.1-terra"
